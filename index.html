<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F1 Sprint</title>
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <div id="rotate-warning">🔄 Please Rotate Your Phone</div>

    <div id="ui-layer">
        <div class="ui-item title">F1 SPRINT</div>
        <div class="ui-item">LAP: <span id="lap-counter">1</span>/3</div>
        <div class="ui-item">TIME: <span id="timer-display">00:00.000</span></div>
        
        <div class="ui-item" style="font-size: 14px; text-align: right; color: #aaa; line-height: 1.2;">
            BEST LAP: <span id="best-lap" style="color: #fff;">--:--.---</span><br>
            BEST RACE: <span id="best-race" style="color: #fff;">--:--.---</span>
        </div>
        
        <button id="btn-help" title="Help">⚙️</button>
    </div>

    <div id="start-lights">
        <div class="light" id="light-1"></div>
        <div class="light" id="light-2"></div>
        <div class="light" id="light-3"></div>
        <div class="light" id="light-4"></div>
        <div class="light" id="light-5"></div>
    </div>

    <div id="game-wrapper">
        <div class="side-controls left-controls">
            <button id="btn-brake">BRK</button>
            <button id="btn-gas">GAS</button>
        </div>

        <div id="game-container"></div>
        
        <div class="side-controls right-controls">
            <button id="btn-left">◀</button>
            <button id="btn-right">▶</button>
        </div>
    </div>

    <div id="help-modal">
        <h2>HOW TO PLAY</h2>
        <p><b>Accelerate:</b> UP Arrow / GAS Button</p>
        <p><b>Brake:</b> DOWN Arrow / BRK Button</p>
        <p><b>Steer:</b> LEFT & RIGHT</p>
        <div style="margin-top: 20px;">
            <button id="btn-close">Close</button>
            <button id="btn-install">Install App</button>
        </div>
    </div>

    <div id="results-modal">
        <h1 style="font-size: 40px; margin: 0; color: #fff;">🏁 FINISH 🏁</h1>
        <h2 id="res-position" style="color: #e10600; font-size: 28px;">POSITION: 1st</h2>
        <div class="results-stats">
            <p>FINAL TIME: <span id="res-final">--:--.---</span></p>
            <p>BEST LAP: <span id="res-best">--:--.---</span></p>
        </div>
        <button id="btn-restart">Play Again</button>
    </div>
    
    <script src="js/game.js"></script>
    
    <script>
        const helpBtn = document.getElementById('btn-help');
        const closeBtn = document.getElementById('btn-close');
        const helpModal = document.getElementById('help-modal');

        helpBtn.addEventListener('click', () => helpModal.classList.add('show'));
        closeBtn.addEventListener('click', () => helpModal.classList.remove('show'));

        document.getElementById('btn-restart').addEventListener('click', () => {
            location.reload(); 
        });

        let deferredPrompt;
        const installBtn = document.getElementById('btn-install');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed: ', err));
            });
        }
    </script>
</body>
</html>
