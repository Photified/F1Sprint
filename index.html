<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro F1 Sprint</title>
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <div class="ui-item title">🏎️ RETRO F1</div>
        <div class="ui-item">LAP: <span id="lap-counter">1</span>/3</div>
        <div class="ui-item">TIME: <span id="timer-display">00:00.000</span></div>
        <button id="btn-help" title="Help">⚙️</button>
    </div>

    <div id="game-wrapper">
        <div id="game-container"></div>
        
        <div id="mobile-controls">
            <div class="d-pad">
                <button id="btn-left">◀</button>
                <button id="btn-right">▶</button>
            </div>
            <div class="action-buttons">
                <button id="btn-brake">Brake</button>
                <button id="btn-gas">GAS</button>
            </div>
        </div>
    </div>

    <div id="help-modal">
        <h2>HOW TO PLAY</h2>
        <p><b>Accelerate:</b> UP Arrow / GAS Button</p>
        <p><b>Brake:</b> DOWN Arrow / Brake Button</p>
        <p><b>Steer:</b> LEFT & RIGHT</p>
        <div style="margin-top: 20px;">
            <button id="btn-close">Close</button>
            <button id="btn-install">Install App</button>
        </div>
    </div>
    
    <script src="js/game.js"></script>
    
    <script>
        const helpBtn = document.getElementById('btn-help');
        const closeBtn = document.getElementById('btn-close');
        const modal = document.getElementById('help-modal');

        helpBtn.addEventListener('click', () => modal.classList.add('show'));
        closeBtn.addEventListener('click', () => modal.classList.remove('show'));

        let deferredPrompt;
        const installBtn = document.getElementById('btn-install');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed: ', err));
            });
        }
    </script>
</body>
</html>
